version: '3.8'

services:
  # 1. PostgreSQL Data Warehouse
  postgres:
    image: postgres:15-alpine
    container_name: churn_postgres_warehouse
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: churn_warehouse
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/warehouse/ddl.sql:/docker-entrypoint-initdb.d/init_schemas.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d churn_warehouse"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - churn_network

  # 2. Mock Customer Support Ticket REST API
  mock-ticket-api:
    build:
      context: .
      dockerfile: docker/Dockerfile.mock_api
    container_name: churn_mock_ticket_api
    ports:
      - "8001:8001"
    networks:
      - churn_network

  # 3. FastAPI Serving Layer
  fastapi-app:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: churn_fastapi_server
    ports:
      - "8000:8000"
    environment:
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_USER=postgres
      - DATABASE_PASSWORD=password
      - DATABASE_NAME=churn_warehouse
    depends_on:
      postgres:
        condition: service_healthy
      mock-ticket-api:
        condition: service_started
    networks:
      - churn_network

  # 4. Streamlit Retention Cockpit
  streamlit-dashboard:
    build:
      context: .
      dockerfile: docker/Dockerfile.dashboard
    container_name: churn_streamlit_cockpit
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://fastapi-app:8000
    volumes:
      - ./src/dashboard:/app/src/dashboard
    depends_on:
      - fastapi-app
    networks:
      - churn_network

networks:
  churn_network:
    driver: bridge

volumes:
  postgres_data:
