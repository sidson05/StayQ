name: Scheduled Churn ETL & Model Validation

on:
  schedule:
    # Run every night at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Enable manual run from GitHub UI
  push:
    branches: [ main, master ]

jobs:
  run-etl-and-eval:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: churn_warehouse
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PYTHONPATH: .

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate Multi-Source Data
        run: python data/generate_multisource_data.py

      - name: Run Automated ETL Pipeline
        run: python src/etl/pipeline.py

      - name: Run ML Training & Evaluation
        run: python src/ml/train.py

      - name: Run Automated Pytest Suite
        run: pytest tests/ -v
